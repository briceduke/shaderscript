# Gates for the hello-compute spine. CI runs structure + subset/compile +
# harness without SHADERSCRIPT_EXPECT_GPU so missing devices stay unverifiable.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Structure
        run: bun run checks:structure

      - name: Compile
        run: bun run test:compile

      - name: Harness
        run: bun run test:harness
